<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    >

    <meta
        name="theme-color"
        content="#070b14"
    >

    <title>Aman AI</title>

    <link
        rel="stylesheet"
        href="style.css"
    >

    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github-dark.min.css"
    >
</head>

<body>

    <!-- Animated Background -->
    <div
        class="background"
        aria-hidden="true"
    >
        <div class="orb orb1"></div>
        <div class="orb orb2"></div>
        <div class="grid"></div>
    </div>


    <!-- Sidebar -->
    <aside
        class="sidebar"
        id="sidebar"
        aria-label="Aman AI navigation"
        aria-hidden="true"
    >

        <div class="sidebar-header">

            <div class="sidebar-brand">
                <div class="sidebar-logo">
                    A
                </div>

                <div>
                    <h2>Aman AI</h2>
                    <span>Your AI workspace</span>
                </div>
            </div>

            <button
                id="closeSidebarBtn"
                class="icon-btn"
                type="button"
                aria-label="Close sidebar"
            >
                ✕
            </button>

        </div>


        <!-- Workspace Switcher -->
        <div class="workspace-section">

            <div class="sidebar-section-title">
                Workspace
            </div>

            <select
                id="workspaceSelect"
                class="workspace-select"
                aria-label="Select workspace"
            >
                <option value="general">
                    🌐 General
                </option>

                <option value="school">
                    🎓 School
                </option>

                <option value="coding">
                    💻 Coding
                </option>

                <option value="business">
                    📊 Business
                </option>

                <option value="safari">
                    🦁 Safari
                </option>

                <option value="agriculture">
                    🌱 Agriculture
                </option>

                <option value="health">
                    🩺 Health
                </option>

                <option value="bible">
                    📖 Bible
                </option>
            </select>

        </div>


        <button
            id="newChatBtn"
            class="new-chat-btn"
            type="button"
        >
            ＋ New Chat
        </button>


        <div class="history-title">
            Chats
        </div>

        <div
            id="chatList"
            class="chat-list"
            aria-live="polite"
        ></div>


        <div class="sidebar-footer">

            <a
                href="/dashboard"
                class="sidebar-dashboard-link"
            >
                ⚙ Dashboard
            </a>

        </div>

    </aside>


    <!-- Mobile Overlay -->
    <div
        id="overlay"
        class="overlay"
        aria-hidden="true"
    ></div>


    <!-- Main -->
    <main class="main">

        <!-- Header -->
        <header class="header">

            <div class="left-header">

                <button
                    id="menuBtn"
                    class="icon-btn"
                    type="button"
                    aria-label="Open sidebar"
                    aria-controls="sidebar"
                    aria-expanded="false"
                >
                    ☰
                </button>

                <div class="brand-stack">

                    <div class="logo">
                        🤖 Aman AI
                    </div>

                    <div class="header-meta">
                        <span class="status">
                            ● Online
                        </span>

                        <span
                            id="workspaceBadge"
                            class="workspace-badge"
                        >
                            General
                        </span>
                    </div>

                </div>

            </div>


            <div class="header-actions">

                <a
                    href="/dashboard"
                    class="dashboard-link"
                >
                    <span class="dashboard-label">
                        Dashboard
                    </span>

                    <span
                        class="dashboard-icon"
                        aria-hidden="true"
                    >
                        ⚙
                    </span>
                </a>

                <button
                    id="deleteChatBtn"
                    class="icon-btn danger"
                    type="button"
                    aria-label="Delete current chat"
                >
                    🗑
                </button>

            </div>

        </header>


        <!-- Chat -->
        <section
            id="chat"
            class="chat"
            aria-live="polite"
        >
            <!-- Messages appear here -->
        </section>


        <!-- Composer -->
        <footer class="composer-wrap">

            <div class="composer">

                <button
                    id="attachBtn"
                    class="composer-btn"
                    type="button"
                    aria-label="Attach file"
                >
                    ＋
                </button>

                <button
                    id="voiceBtn"
                    class="composer-btn"
                    type="button"
                    aria-label="Voice input"
                >
                    🎤
                </button>

                <textarea
                    id="input"
                    rows="1"
                    maxlength="12000"
                    placeholder="Message Aman AI..."
                    aria-label="Message Aman AI"
                ></textarea>

                <button
                    id="sendBtn"
                    class="send-btn"
                    type="button"
                    aria-label="Send message"
                >
                    ➤
                </button>

            </div>

            <div class="composer-note">
                Aman AI can make mistakes. Verify important information.
            </div>

        </footer>

    </main>


    <!-- Aman AI Action Modal -->
    <div
        id="actionModal"
        class="action-modal"
        aria-hidden="true"
    >
        <div
            class="action-modal-card"
            role="dialog"
            aria-modal="true"
            aria-labelledby="actionModalTitle"
        >
            <div class="action-modal-head">
                <h3 id="actionModalTitle">
                    Chat action
                </h3>

                <button
                    id="actionModalClose"
                    class="icon-btn"
                    type="button"
                    aria-label="Close"
                >
                    ✕
                </button>
            </div>

            <div
                id="actionModalBody"
                class="action-modal-body"
            ></div>
        </div>
    </div>


    <!-- Hidden File Input -->
    <input
        type="file"
        id="fileInput"
        hidden
        accept=".pdf,.txt,.doc,.docx,.csv,image/*"
    >


    <!-- Markdown -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

    <!-- Highlight.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>

    <!-- Main Script -->
    <script src="script.js"></script>

</body>
</html>
