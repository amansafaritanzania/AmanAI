<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sign In | Aman AI</title>
<style>
:root{--bg:#07110e;--panel:#0e1d18;--line:rgba(255,255,255,.09);--text:#f5f7f5;--muted:#a7b4ad;--accent:#d4ad62;--accent2:#f1d79b;--danger:#ff7d7d;--ok:#75df9a}*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:radial-gradient(circle at 20% 0%,rgba(35,91,70,.25),transparent 38%),linear-gradient(145deg,#07110e,#0a1712 58%,#07110e);color:var(--text)}body{min-height:100dvh}.shell{min-height:100dvh;display:grid;place-items:center;padding:22px}.card{width:min(470px,100%);background:rgba(14,29,24,.94);border:1px solid var(--line);border-radius:26px;padding:30px;box-shadow:0 30px 90px rgba(0,0,0,.34)}.brand{display:flex;align-items:center;gap:12px;margin-bottom:25px}.logo{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;background:linear-gradient(145deg,var(--accent2),var(--accent));color:#152017;font-weight:900}.brand strong{display:block;font-size:17px}.brand span{display:block;color:var(--muted);font-size:12px;margin-top:2px}h1{font-size:31px;letter-spacing:-.03em;margin:0 0 8px}.lead{color:var(--muted);font-size:14px;line-height:1.6;margin:0 0 22px}.field{margin:0 0 15px}label{display:block;font-size:12px;font-weight:700;margin:0 0 7px;color:#dbe3df}input{width:100%;min-height:48px;border-radius:13px;border:1px solid var(--line);background:#0a1712;color:var(--text);padding:12px 13px;outline:none;font:inherit}input:focus{border-color:rgba(212,173,98,.72);box-shadow:0 0 0 3px rgba(212,173,98,.12)}button{width:100%;min-height:49px;border:0;border-radius:14px;cursor:pointer;font-weight:800;font-size:14px;background:linear-gradient(135deg,var(--accent2),var(--accent));color:#152017}button:disabled{opacity:.6}.message{display:none;padding:11px 12px;border-radius:12px;margin:0 0 15px;font-size:12px}.message.show{display:block}.message.error{background:rgba(255,125,125,.1);border:1px solid rgba(255,125,125,.3);color:#ffc2c2}.message.ok{background:rgba(117,223,154,.09);border:1px solid rgba(117,223,154,.25);color:#bdf4ce}.bottom{text-align:center;color:var(--muted);font-size:12px;margin-top:18px}.bottom a,.forgot{color:var(--accent2);font-weight:800;text-decoration:none}.divider{display:flex;align-items:center;gap:11px;margin:17px 0;color:var(--muted);font-size:11px;text-transform:uppercase}.divider:before,.divider:after{content:"";height:1px;background:var(--line);flex:1}.google-wrap{min-height:44px;display:grid;place-items:center}.password-row{display:flex;justify-content:space-between;align-items:center;gap:10px}.forgot{font-size:11px}.small{font-size:11px;color:var(--muted);line-height:1.5}@media(max-width:520px){.shell{padding:12px}.card{padding:22px 18px;border-radius:20px}h1{font-size:28px}}
</style>
<script src="https://accounts.google.com/gsi/client" async defer></script>
</head>
<body>
<main class="shell"><section class="card" aria-labelledby="title">
<div class="brand"><div class="logo">A</div><div><strong>Aman AI</strong><span>Personal AI workspace</span></div></div>
<h1 id="title">Welcome back</h1>
<p class="lead">Sign in to continue with the same account, chats and permanent memory.</p>
<div id="message" class="message"></div>
<div id="googleWrap" class="google-wrap"></div>
<div class="divider">or</div>
<form id="loginForm">
<div class="field"><label for="email">Email</label><input id="email" type="email" maxlength="254" autocomplete="email" required></div>
<div class="field"><div class="password-row"><label for="password">Password</label><a class="forgot" href="/forgot-password">Forgot password?</a></div><input id="password" type="password" maxlength="128" autocomplete="current-password" required></div>
<button id="submitBtn" type="submit">Sign in</button>
</form>
<div class="bottom">New to Aman AI? <a href="/signup">Create account</a></div>
</section></main>
<script>
(()=>{const form=document.getElementById("loginForm"),btn=document.getElementById("submitBtn"),message=document.getElementById("message"),googleWrap=document.getElementById("googleWrap");const show=(text,type="error")=>{message.textContent=text;message.className="message show "+type;};async function googleLogin(credential){try{const r=await fetch("/api/auth/google",{method:"POST",headers:{"Content-Type":"application/json"},credentials:"same-origin",body:JSON.stringify({credential})});const d=await r.json().catch(()=>({}));if(!r.ok||!d.success)throw new Error(d.message||"Google sign-in failed.");show("Signed in with Google. Opening Aman AI…","ok");setTimeout(()=>location.href="/dashboard",250);}catch(e){show(e.message||"Google sign-in failed.");}}async function initGoogle(){try{const r=await fetch("/api/auth/google-config",{credentials:"same-origin"});const d=await r.json().catch(()=>({}));if(!d.enabled||!d.clientId){googleWrap.innerHTML='<div class="small">Google sign-in will appear after GOOGLE_CLIENT_ID is configured.</div>';return;}const wait=()=>{if(!window.google?.accounts?.id)return setTimeout(wait,100);google.accounts.id.initialize({client_id:d.clientId,callback:x=>googleLogin(x.credential)});google.accounts.id.renderButton(googleWrap,{type:"standard",theme:"outline",size:"large",text:"continue_with",shape:"pill",width:390});};wait();}catch{googleWrap.innerHTML='<div class="small">Google sign-in is temporarily unavailable.</div>';}}form.addEventListener("submit",async e=>{e.preventDefault();btn.disabled=true;message.className="message";try{const r=await fetch("/api/auth/login",{method:"POST",headers:{"Content-Type":"application/json"},credentials:"same-origin",body:JSON.stringify({email:document.getElementById("email").value.trim(),password:document.getElementById("password").value})});const d=await r.json().catch(()=>({}));if(!r.ok||!d.success)throw new Error(d.message||"Could not sign in.");show("Signed in. Opening Aman AI…","ok");setTimeout(()=>location.href="/dashboard",250);}catch(e){show(e.message||"Could not sign in.");btn.disabled=false;}});initGoogle();})();
</script>
</body></html>
