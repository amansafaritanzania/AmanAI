<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Create Account | Aman AI</title><style>:root{--line:rgba(255,255,255,.09);--text:#f5f7f5;--muted:#a7b4ad;--accent:#d4ad62;--accent2:#f1d79b}*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Inter,system-ui,sans-serif;background:radial-gradient(circle at 20% 0%,rgba(35,91,70,.25),transparent 38%),linear-gradient(145deg,#07110e,#0a1712 58%,#07110e);color:var(--text)}body{min-height:100dvh}.shell{min-height:100dvh;display:grid;place-items:center;padding:22px}.card{width:min(470px,100%);background:rgba(14,29,24,.94);border:1px solid var(--line);border-radius:26px;padding:30px;box-shadow:0 30px 90px rgba(0,0,0,.34)}.brand{display:flex;align-items:center;gap:12px;margin-bottom:25px}.logo{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;background:linear-gradient(145deg,var(--accent2),var(--accent));color:#152017;font-weight:900}.brand strong{display:block}.brand span,.lead,.small,.bottom{color:var(--muted)}h1{font-size:31px;margin:0 0 8px}.lead{font-size:14px;line-height:1.6;margin:0 0 22px}.field{margin-bottom:15px}label{display:block;font-size:12px;font-weight:700;margin-bottom:7px}input,select{width:100%;min-height:48px;border-radius:13px;border:1px solid var(--line);background:#0a1712;color:var(--text);padding:12px 13px;font:inherit}button{width:100%;min-height:49px;border:0;border-radius:14px;font-weight:800;background:linear-gradient(135deg,var(--accent2),var(--accent));color:#152017}.message{display:none;padding:11px 12px;border-radius:12px;margin-bottom:15px;font-size:12px}.message.show{display:block}.message.error{background:#ff7d7d1a;color:#ffc2c2}.message.ok{background:#75df9a17;color:#bdf4ce}.divider{display:flex;align-items:center;gap:11px;margin:17px 0;color:var(--muted);font-size:11px;text-transform:uppercase}.divider:before,.divider:after{content:"";height:1px;background:var(--line);flex:1}.google-wrap{min-height:44px;display:grid;place-items:center}.small,.bottom{font-size:11px}.consent{display:flex;align-items:flex-start;gap:10px;margin:2px 0 16px;padding:12px;border:1px solid var(--line);border-radius:13px;background:#0a1712}.consent input{width:18px;height:18px;min-height:18px;flex:0 0 18px;margin:1px 0 0;accent-color:var(--accent)}.consent label{margin:0;font-size:11px;line-height:1.55;color:var(--muted);font-weight:600}.consent a{color:var(--accent2);font-weight:800;text-decoration:none}.bottom{text-align:center;margin-top:18px}.bottom a{color:var(--accent2);font-weight:800;text-decoration:none}@media(max-width:520px){.shell{padding:12px}.card{padding:22px 18px;border-radius:20px}}</style><script src="https://accounts.google.com/gsi/client" async defer></script></head><body><main class="shell"><section class="card"><div class="brand"><div class="logo">A</div><div><strong>Aman AI</strong><span>Personal AI workspace</span></div></div><h1>Create your account</h1><p class="lead">Keep your chats and permanent AI memory connected to one account.</p><div id="message" class="message"></div><div id="googleWrap" class="google-wrap"></div><div class="divider">or create with email</div><form id="signupForm"><div class="field"><label>Name</label><input id="name" maxlength="80" required></div><div class="field"><label>Email</label><input id="email" type="email" maxlength="254" required></div><div class="field"><label>Preferred language</label><select id="language"><option value="en">English</option><option value="sw">Kiswahili</option></select></div><div class="field"><label>Password</label><input id="password" type="password" minlength="8" maxlength="128" required><div class="small">Use at least 8 characters.</div></div><div class="consent"><input id="consent" type="checkbox" required><label for="consent">I agree to the <a href="/terms" target="_blank" rel="noopener">Terms of Use</a> and <a href="/privacy" target="_blank" rel="noopener">Privacy Policy</a>.</label></div><button id="submitBtn" type="submit">Create account</button></form><div class="bottom">Already have an account? <a href="/login">Sign in</a></div></section></main><script>(()=>{const f=document.getElementById("signupForm"),b=document.getElementById("submitBtn"),m=document.getElementById("message"),g=document.getElementById("googleWrap"),consent=document.getElementById("consent"),show=(t,y="error")=>{m.textContent=t;m.className="message show "+y;};async function gl(c){if(!consent.checked){show("Please agree to the Terms of Use and Privacy Policy first.");return;}try{const r=await fetch("/api/auth/google",{method:"POST",headers:{"Content-Type":"application/json"},credentials:"same-origin",body:JSON.stringify({credential:c,acceptTerms:consent.checked,acceptPrivacy:consent.checked})}),d=await r.json().catch(()=>({}));if(!r.ok||!d.success)throw new Error(d.message||"Google sign-in failed.");show("Google account connected. Opening Aman AI…","ok");setTimeout(()=>location.href="/dashboard",250);}catch(e){show(e.message);}}async function ig(){try{const r=await fetch("/api/auth/google-config"),d=await r.json();if(!d.enabled||!d.clientId){g.innerHTML='<div class="small">Google sign-up will appear after GOOGLE_CLIENT_ID is configured.</div>';return;}const w=()=>{if(!window.google?.accounts?.id)return setTimeout(w,100);google.accounts.id.initialize({client_id:d.clientId,callback:x=>gl(x.credential)});google.accounts.id.renderButton(g,{type:"standard",theme:"outline",size:"large",text:"continue_with",shape:"pill",width:390});};w();}catch{g.innerHTML='<div class="small">Google sign-up is temporarily unavailable.</div>';}}f.addEventListener("submit",async e=>{e.preventDefault();if(!consent.checked){show("Please agree to the Terms of Use and Privacy Policy first.");return;}b.disabled=true;m.className="message";try{const r=await fetch("/api/auth/signup",{method:"POST",headers:{"Content-Type":"application/json"},credentials:"same-origin",body:JSON.stringify({name:name.value,email:email.value,preferredLanguage:language.value,password:password.value,acceptTerms:consent.checked,acceptPrivacy:consent.checked})}),d=await r.json().catch(()=>({}));if(!r.ok||!d.success)throw new Error(d.message||"Could not create account.");show("Account created. Opening your workspace…","ok");setTimeout(()=>location.href="/dashboard",300);}catch(e){show(e.message);b.disabled=false;}});ig();})();</script></body></html>
