<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Reset Password | Aman AI</title><style>:root{--line:rgba(255,255,255,.09);--text:#f5f7f5;--muted:#a7b4ad;--accent:#d4ad62;--accent2:#f1d79b}*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Inter,system-ui,sans-serif;background:linear-gradient(145deg,#07110e,#0a1712 58%,#07110e);color:var(--text)}.shell{min-height:100dvh;display:grid;place-items:center;padding:22px}.card{width:min(470px,100%);background:#0e1d18;border:1px solid var(--line);border-radius:26px;padding:30px}.brand{display:flex;gap:12px;align-items:center;margin-bottom:24px}.logo{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;background:linear-gradient(145deg,var(--accent2),var(--accent));color:#152017;font-weight:900}.muted,.lead,.bottom{color:var(--muted)}h1{margin:0 0 8px}.lead{font-size:14px;line-height:1.6}.field{margin:15px 0}label{display:block;font-size:12px;font-weight:700;margin-bottom:7px}input{width:100%;min-height:48px;border-radius:13px;border:1px solid var(--line);background:#0a1712;color:var(--text);padding:12px;font:inherit}button{width:100%;min-height:49px;border:0;border-radius:14px;background:linear-gradient(135deg,var(--accent2),var(--accent));font-weight:800;color:#152017}.message{display:none;padding:11px 12px;border-radius:12px;margin:15px 0;font-size:12px}.message.show{display:block}.message.error{background:#ff7d7d1a;color:#ffc2c2}.message.ok{background:#75df9a17;color:#bdf4ce}.step{display:none}.step.active{display:block}.code{font-size:22px;letter-spacing:.28em;text-align:center;font-weight:800}.bottom{text-align:center;font-size:12px;margin-top:18px}.bottom a{color:var(--accent2);font-weight:800;text-decoration:none}</style></head><body><main class="shell"><section class="card"><div class="brand"><div class="logo">A</div><div><strong>Aman AI</strong><div class="muted">Account recovery</div></div></div><h1>Reset your password</h1><p class="lead">We’ll send a 6-digit verification code to your account email.</p><div id="message" class="message"></div><div id="step1" class="step active"><form id="requestForm"><div class="field"><label>Account email</label><input id="email" type="email" required></div><button id="requestBtn">Send verification code</button></form></div><div id="step2" class="step"><form id="verifyForm"><div class="field"><label>6-digit code</label><input class="code" id="code" inputmode="numeric" pattern="[0-9]{6}" maxlength="6" required></div><button id="verifyBtn">Verify code</button></form><div class="bottom"><a href="#" id="resend">Send a new code</a></div></div><div id="step3" class="step"><form id="resetForm"><div class="field"><label>New password</label><input id="newPassword" type="password" minlength="8" maxlength="128" required></div><div class="field"><label>Confirm password</label><input id="confirmPassword" type="password" minlength="8" maxlength="128" required></div><button id="resetBtn">Change password</button></form></div><div class="bottom">Remembered it? <a href="/login">Back to sign in</a></div></section></main><script>(()=>{const m=document.getElementById("message"),show=(t,y="error")=>{m.textContent=t;m.className="message show "+y;},act=id=>{document.querySelectorAll(".step").forEach(x=>x.classList.remove("active"));document.getElementById(id).classList.add("active");};let em="";async function post(u,b){const r=await fetch(u,{method:"POST",headers:{"Content-Type":"application/json"},credentials:"same-origin",body:JSON.stringify(b)}),d=await r.json().catch(()=>({}));if(!r.ok||!d.success)throw new Error(d.message||"Request failed.");return d;}requestForm.addEventListener("submit",async e=>{e.preventDefault();requestBtn.disabled=true;em=email.value.trim();try{const d=await post("/api/auth/password/forgot",{email:em});show(d.message,"ok");act("step2");code.focus();}catch(x){show(x.message);}finally{requestBtn.disabled=false;}});verifyForm.addEventListener("submit",async e=>{e.preventDefault();verifyBtn.disabled=true;try{await post("/api/auth/password/verify",{email:em,code:code.value});show("Code verified. Create a new password.","ok");act("step3");newPassword.focus();}catch(x){show(x.message);}finally{verifyBtn.disabled=false;}});resetForm.addEventListener("submit",async e=>{e.preventDefault();if(newPassword.value!==confirmPassword.value)return show("The two passwords do not match.");resetBtn.disabled=true;try{const d=await post("/api/auth/password/reset",{email:em,code:code.value,newPassword:newPassword.value});show(d.message,"ok");setTimeout(()=>location.href="/login",900);}catch(x){show(x.message);resetBtn.disabled=false;}});resend.addEventListener("click",async e=>{e.preventDefault();try{const d=await post("/api/auth/password/forgot",{email:em});code.value="";show(d.message,"ok");}catch(x){show(x.message);}});})();</script></body></html>
