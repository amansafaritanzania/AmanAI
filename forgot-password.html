<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Reset Password | Aman AI</title><style>:root{--line:rgba(255,255,255,.09);--text:#f5f7f5;--muted:#a7b4ad;--accent:#d4ad62;--accent2:#f1d79b}*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Inter,system-ui,sans-serif;background:linear-gradient(145deg,#07110e,#0a1712 58%,#07110e);color:var(--text)}.shell{min-height:100dvh;display:grid;place-items:center;padding:22px}.card{width:min(470px,100%);background:#0e1d18;border:1px solid var(--line);border-radius:26px;padding:30px}.brand{display:flex;gap:12px;align-items:center;margin-bottom:24px}.logo{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;background:linear-gradient(145deg,var(--accent2),var(--accent));color:#152017;font-weight:900}.muted,.lead,.bottom{color:var(--muted)}h1{margin:0 0 8px}.lead{font-size:14px;line-height:1.6}.field{margin:15px 0}label{display:block;font-size:12px;font-weight:700;margin-bottom:7px}input{width:100%;min-height:48px;border-radius:13px;border:1px solid var(--line);background:#0a1712;color:var(--text);padding:12px;font:inherit}button{width:100%;min-height:49px;border:0;border-radius:14px;background:linear-gradient(135deg,var(--accent2),var(--accent));font-weight:800;color:#152017}.message{display:none;padding:11px 12px;border-radius:12px;margin:15px 0;font-size:12px}.message.show{display:block}.message.error{background:#ff7d7d1a;color:#ffc2c2}.message.ok{background:#75df9a17;color:#bdf4ce}.step{display:none}.step.active{display:block}.code{font-size:22px;letter-spacing:.28em;text-align:center;font-weight:800}.bottom{text-align:center;font-size:12px;margin-top:18px}.bottom a{color:var(--accent2);font-weight:800;text-decoration:none}</style></head><body><main class="shell"><section class="card"><div class="brand"><div class="logo">A</div><div><strong>Aman AI</strong><div class="muted">Account recovery</div></div></div><h1>Reset your password</h1><p class="lead">We’ll send a 6-digit verification code to your account email.</p><div id="message" class="message"></div><div id="step1" class="step active"><form id="requestForm"><div class="field"><label>Account email</label><input id="email" type="email" required></div><button id="requestBtn">Send verification code</button></form></div><div id="step2" class="step"><form id="verifyForm"><div class="field"><label>6-digit code</label><input class="code" id="code" inputmode="numeric" pattern="[0-9]{6}" maxlength="6" required></div><button id="verifyBtn">Verify code</button></form><div class="bottom"><a href="#" id="resend">Send a new code</a></div></div><div id="step3" class="step"><form id="resetForm"><div class="field"><label>New password</label><input id="newPassword" type="password" minlength="8" maxlength="128" required></div><div class="field"><label>Confirm password</label><input id="confirmPassword" type="password" minlength="8" maxlength="128" required></div><button id="resetBtn">Change password</button></form></div><div class="bottom">Remembered it? <a href="/login">Back to sign in</a></div></section></main><script>
(() => {
    "use strict";

    const messageBox = document.getElementById("message");
    const requestForm = document.getElementById("requestForm");
    const requestBtn = document.getElementById("requestBtn");
    const emailInput = document.getElementById("email");

    const verifyForm = document.getElementById("verifyForm");
    const verifyBtn = document.getElementById("verifyBtn");
    const codeInput = document.getElementById("code");
    const resend = document.getElementById("resend");

    const resetForm = document.getElementById("resetForm");
    const resetBtn = document.getElementById("resetBtn");
    const newPasswordInput = document.getElementById("newPassword");
    const confirmPasswordInput = document.getElementById("confirmPassword");

    let accountEmail = "";

    function show(text, type = "error") {
        messageBox.textContent = text;
        messageBox.className = "message show " + type;
    }

    function activateStep(id) {
        document
            .querySelectorAll(".step")
            .forEach(step => step.classList.remove("active"));

        document.getElementById(id)?.classList.add("active");
    }

    async function post(url, body) {
        const response = await fetch(url, {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            credentials: "same-origin",
            body: JSON.stringify(body)
        });

        const data = await response
            .json()
            .catch(() => ({}));

        if (!response.ok || !data.success) {
            throw new Error(
                data.message ||
                `Request failed (${response.status}).`
            );
        }

        return data;
    }

    requestForm.addEventListener("submit", async event => {
        event.preventDefault();

        accountEmail = emailInput.value.trim();

        if (!accountEmail) {
            show("Enter your account email.");
            return;
        }

        requestBtn.disabled = true;
        requestBtn.textContent = "Sending...";

        try {
            const data = await post(
                "/api/auth/password/forgot",
                { email: accountEmail }
            );

            show(
                data.message ||
                "Verification code sent.",
                "ok"
            );

            activateStep("step2");
            codeInput.focus();

        } catch (error) {
            console.error(
                "PASSWORD RECOVERY REQUEST ERROR:",
                error
            );

            show(error.message);

        } finally {
            requestBtn.disabled = false;
            requestBtn.textContent =
                "Send verification code";
        }
    });

    verifyForm.addEventListener("submit", async event => {
        event.preventDefault();

        verifyBtn.disabled = true;
        verifyBtn.textContent = "Verifying...";

        try {
            await post(
                "/api/auth/password/verify",
                {
                    email: accountEmail,
                    code: codeInput.value.trim()
                }
            );

            show(
                "Code verified. Create a new password.",
                "ok"
            );

            activateStep("step3");
            newPasswordInput.focus();

        } catch (error) {
            show(error.message);

        } finally {
            verifyBtn.disabled = false;
            verifyBtn.textContent = "Verify code";
        }
    });

    resetForm.addEventListener("submit", async event => {
        event.preventDefault();

        if (
            newPasswordInput.value !==
            confirmPasswordInput.value
        ) {
            show(
                "The two passwords do not match."
            );
            return;
        }

        resetBtn.disabled = true;
        resetBtn.textContent =
            "Changing password...";

        try {
            const data = await post(
                "/api/auth/password/reset",
                {
                    email: accountEmail,
                    code: codeInput.value.trim(),
                    newPassword:
                        newPasswordInput.value
                }
            );

            show(
                data.message ||
                "Password changed.",
                "ok"
            );

            setTimeout(
                () => {
                    location.href = "/login";
                },
                900
            );

        } catch (error) {
            show(error.message);
            resetBtn.disabled = false;
            resetBtn.textContent =
                "Change password";
        }
    });

    resend.addEventListener("click", async event => {
        event.preventDefault();

        if (!accountEmail) {
            activateStep("step1");
            emailInput.focus();
            return;
        }

        resend.style.pointerEvents = "none";
        resend.textContent = "Sending...";

        try {
            const data = await post(
                "/api/auth/password/forgot",
                { email: accountEmail }
            );

            codeInput.value = "";

            show(
                data.message ||
                "A new verification code has been sent.",
                "ok"
            );

        } catch (error) {
            show(error.message);

        } finally {
            resend.style.pointerEvents = "";
            resend.textContent = "Send a new code";
        }
    });
})();
</script></body></html>
